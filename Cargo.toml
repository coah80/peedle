[workspace]
resolver = "2"
members = [
    "crates/peedle-url",
    "crates/peedle-net",
    "crates/peedle-html",
    "crates/peedle-css",
    "crates/peedle-layout",
    "crates/peedle-js",
    "crates/peedle-render",
    "crates/peedle-dom",
    "crates/peedle-engine",
    "crates/peedle",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
peedle-url = { path = "crates/peedle-url" }
peedle-net = { path = "crates/peedle-net" }
peedle-html = { path = "crates/peedle-html" }
peedle-css = { path = "crates/peedle-css" }
peedle-layout = { path = "crates/peedle-layout" }
peedle-js = { path = "crates/peedle-js" }
peedle-render = { path = "crates/peedle-render" }
peedle-dom = { path = "crates/peedle-dom" }
peedle-engine = { path = "crates/peedle-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
rustls-pki-types = "1.13"
flate2 = "1.1"
brotli-decompressor = "5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
fontdue = "0.9.4"
ttf-parser = "0.25.1"
wuff = "0.2"
winit = "0.30.13"
softbuffer = "0.4.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
getrandom = "0.3"
base64 = "0.22"
unicode-normalization = "0.1.25"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
